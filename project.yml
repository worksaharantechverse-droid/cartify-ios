{
  "name": "Cartify",
  "options": {
    "deploymentTarget": "17.0",
    "createIntermediateGroups": true,
    "bundleIdPrefix": "com.portfolio",
    "groupSortPosition": "top"
  },
  "settings": {
    "SWIFT_VERSION": "5.0",
    "IPHONEOS_DEPLOYMENT_TARGET": "17.0",
    "CLANG_ENABLE_MODULES": true,
    "ALWAYS_SEARCH_USER_PATHS": false,
    "ENABLE_USER_SCRIPT_SANDBOXING": true,
    "DEVELOPMENT_TEAM": "",
    "CODE_SIGN_STYLE": "Automatic",
    "MARKETING_VERSION": "1.0",
    "CURRENT_PROJECT_VERSION": "1",
    "GENERATE_INFOPLIST_FILE": true
  },
  "targets": {
    "Cartify": {
      "type": "application",
      "platform": "iOS",
      "sources": [
        "Sources/Cartify",
        "Resources"
      ],
      "resources": [
        "Resources/Assets.xcassets"
      ],
      "info": {
        "path": "Sources/Cartify/Info.plist",
        "properties": {
          "CFBundleDisplayName": "Cartify",
          "UILaunchScreen": {},
          "UIApplicationSupportsIndirectInputEvents": true,
          "ITSAppUsesNonExemptEncryption": false,
          "UIApplicationSceneManifest": {
            "UIApplicationSupportsMultipleScenes": false,
            "UISceneConfigurations": {
              "UIWindowSceneSessionRoleApplication": [
                {
                  "UISceneDelegateClassName": "$(PRODUCT_MODULE_NAME).SceneDelegate"
                }
              ]
            }
          }
        }
      },
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.cartify",
        "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME": "AccentColor",
        "SWIFT_EMIT_LOC_STRINGS": true,
        "CODE_SIGN_STYLE": "Automatic",
        "TARGETED_DEVICE_FAMILY": "1",
        "SUPPORTS_MACCATALYST": false
      }
    },
    "CartifyTests": {
      "type": "bundle.unit-test",
      "platform": "iOS",
      "sources": [
        "Tests/CartifyTests"
      ],
      "dependencies": [
        {
          "target": "Cartify"
        }
      ],
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.cartify.tests",
        "CODE_SIGN_STYLE": "Automatic"
      }
    },
    "CartifyUITests": {
      "type": "bundle.ui-testing",
      "platform": "iOS",
      "sources": [
        "UITests/CartifyUITests"
      ],
      "dependencies": [
        {
          "target": "Cartify"
        }
      ],
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.cartify.uitests",
        "CODE_SIGN_STYLE": "Automatic"
      }
    }
  },
  "schemes": [
    {
      "name": "Cartify",
      "buildTargets": [
        {
          "target": "Cartify",
          "debug": true,
          "profile": true,
          "analyze": true,
          "archive": true
        }
      ],
      "testTargets": [
        {
          "target": "CartifyTests"
        },
        {
          "target": "CartifyUITests"
        }
      ],
      "launchAction": {
        "target": "Cartify",
        "debugger": "lldb"
      },
      "profileAction": {
        "target": "Cartify"
      },
      "analyzeAction": {
        "target": "Cartify"
      },
      "archiveAction": {
        "target": "Cartify",
        "revealArchiveInOrganizer": false
      }
    }
  ]
}
